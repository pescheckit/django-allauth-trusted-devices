[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-allauth-trusted-devices"
dynamic = ["version"]
description = "New-device sign-in notifications and email confirmation for django-allauth"
readme = "README.md"
authors = [{ name = "PESCHECK" }]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "Django>=4.2",
    "django-allauth>=65.10,<66",
]

[project.optional-dependencies]
test = [
    "django-allauth[mfa]",
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-cov>=5",
]
dev = [
    "django-allauth-trusted-devices[test]",
    "ruff>=0.6",
    "tox>=4",
]

[project.urls]
Homepage = "https://github.com/pescheckit/django-allauth-trusted-devices"
Issues = "https://github.com/pescheckit/django-allauth-trusted-devices/issues"

[tool.setuptools.dynamic]
version = { attr = "allauth_trusted_devices.__version__" }

[tool.setuptools.packages.find]
include = ["allauth_trusted_devices*"]

[tool.setuptools.package-data]
allauth_trusted_devices = ["templates/**/*", "locale/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["allauth_trusted_devices"]
omit = ["*/migrations/*"]

[tool.ruff.lint.isort]
known-first-party = ["allauth_trusted_devices", "tests"]
